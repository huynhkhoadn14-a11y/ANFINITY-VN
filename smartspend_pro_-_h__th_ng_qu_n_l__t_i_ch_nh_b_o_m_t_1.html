<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSpend Pro - Hệ Thống Quản Lý Tài Chính Bảo Mật</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Authentication Overlay --- */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .auth-card {
            background: var(--card-dark);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid var(--glass);
            width: 350px;
        }

        .auth-card i { font-size: 3rem; color: var(--primary); margin-bottom: 20px; }
        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid var(--text-muted);
            background: transparent;
            color: white;
            text-align: center;
        }

        /* --- Main App Layout --- */
        #app-content {
            display: none;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin: 20px auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(to right, #818cf8, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .logout-btn {
            background: var(--glass);
            border: 1px solid var(--text-muted);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover { background: var(--danger); border-color: var(--danger); }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 1024px) { .grid-container { grid-template-columns: 1fr; } }

        .card {
            background: var(--card-dark);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--glass);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card h2 { font-size: 1.1rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--text-muted); }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, var(--card-dark), #2d3748);
            padding: 20px;
            border-radius: 20px;
            border-left: 5px solid var(--primary);
        }

        .stat-box.income { border-left-color: var(--success); }
        .stat-box.expense { border-left-color: var(--danger); }
        .stat-box span { font-size: 0.8rem; color: var(--text-muted); }
        .stat-box p { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }

        /* Form & Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--glass);
            background: #0f172a;
            color: white;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover { background: var(--primary-dark); }

        /* Transaction List */
        .list-container {
            max-height: 600px;
            overflow-y: auto;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--glass);
            transition: 0.2s;
        }
        .item:hover { background: var(--glass); }
        .item-info div { font-weight: 600; }
        .item-info small { color: var(--text-muted); font-size: 0.7rem; }
        .item-amount { font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .amount-plus { color: var(--success); }
        .amount-minus { color: var(--danger); }

        /* Note Section */
        .note-item {
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid var(--primary);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
        }

        /* Weekly Comparison */
        .comparison-box {
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            font-weight: bold;
        }
        .up { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .down { color: var(--success); background: rgba(16, 185, 129, 0.1); }

    </style>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-overlay">
        <div class="auth-card">
            <i class="fas fa-shield-halved"></i>
            <h2>Secure Access</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Vui lòng nhập mật khẩu để vào</p>
            <input type="password" id="pass-input" placeholder="••••••••">
            <button class="btn-submit" onclick="checkAuth()">Mở Khóa</button>
            <p id="auth-error" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px; display: none;">Sai mật khẩu!</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app-content">
        <header>
            <div class="logo"><i class="fas fa-vault"></i> SmartSpend Pro</div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
        </header>

        <div class="stats-row">
            <div class="stat-box">
                <span>Số dư khả dụng</span>
                <p id="balance">0 ₫</p>
            </div>
            <div class="stat-box income">
                <span>Tổng thu nhập</span>
                <p id="income">0 ₫</p>
            </div>
            <div class="stat-box expense">
                <span>Tổng chi tiêu</span>
                <p id="expense">0 ₫</p>
            </div>
        </div>

        <div class="grid-container">
            <!-- Left: Input & Daily Notes -->
            <div class="left-col">
                <div class="card">
                    <h2><i class="fas fa-plus"></i> Giao dịch mới</h2>
                    <form id="tx-form">
                        <div class="input-group">
                            <label>Nội dung</label>
                            <input type="text" id="tx-text" required placeholder="Ví dụ: Mua sách...">
                        </div>
                        <div class="input-group">
                            <label>Số tiền (₫)</label>
                            <input type="number" id="tx-amount" required placeholder="0">
                        </div>
                        <div class="input-group">
                            <label>Loại</label>
                            <select id="tx-type">
                                <option value="income">Thu nhập</option>
                                <option value="expense">Chi tiêu</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-submit">Lưu Giao Dịch</button>
                    </form>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <h2><i class="fas fa-pen-fancy"></i> Ghi nhớ hôm nay</h2>
                    <div class="input-group">
                        <textarea id="daily-note" rows="3" placeholder="Hôm nay bạn cảm thấy thế nào về chi tiêu?"></textarea>
                    </div>
                    <button class="btn-submit" style="background: var(--secondary);" onclick="saveNote()">Lưu Ghi Chú</button>
                    <div id="notes-list" style="margin-top: 15px;"></div>
                </div>
            </div>

            <!-- Center: History & Chart -->
            <div class="center-col">
                <div class="card">
                    <h2><i class="fas fa-list-ul"></i> Lịch sử chi tiết</h2>
                    <div class="list-container" id="tx-list"></div>
                </div>
                <div class="card" style="margin-top: 20px;">
                    <h2><i class="fas fa-chart-line"></i> Phân tích thu chi</h2>
                    <div style="height: 250px;"><canvas id="mainChart"></canvas></div>
                </div>
            </div>

            <!-- Right: Weekly Analysis -->
            <div class="right-col">
                <div class="card">
                    <h2><i class="fas fa-calendar-week"></i> So sánh tuần</h2>
                    <div id="weekly-analysis">
                        <p style="font-size: 0.9rem; color: var(--text-muted);">Đang tính toán dữ liệu tuần...</p>
                    </div>
                </div>
                <div class="card" style="margin-top: 20px;">
                    <h2><i class="fas fa-lightbulb"></i> Mẹo tài chính</h2>
                    <p id="finance-tip" style="font-size: 0.9rem; line-height: 1.6; color: var(--text-muted);"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Security Config ---
        const MASTER_PASS = "1234"; // Mật khẩu mặc định
        let isAuth = false;

        function checkAuth() {
            const input = document.getElementById('pass-input').value;
            if(input === MASTER_PASS) {
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    init();
                }, 500);
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }

        // --- Data Management ---
        let transactions = JSON.parse(localStorage.getItem('sp_tx')) || [];
        let notes = JSON.parse(localStorage.getItem('sp_notes')) || [];
        let myChart;

        const txForm = document.getElementById('tx-form');
        const txList = document.getElementById('tx-list');

        txForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const transaction = {
                id: Date.now(),
                text: document.getElementById('tx-text').value,
                amount: document.getElementById('tx-type').value === 'expense' 
                        ? -Math.abs(document.getElementById('tx-amount').value) 
                        : Math.abs(document.getElementById('tx-amount').value),
                date: new Date().toISOString()
            };
            transactions.push(transaction);
            updateData();
            txForm.reset();
        });

        function updateData() {
            localStorage.setItem('sp_tx', JSON.stringify(transactions));
            renderList();
            calculateStats();
            renderChart();
            analyzeWeekly();
        }

        function renderList() {
            txList.innerHTML = '';
            transactions.slice().reverse().forEach(t => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div class="item-info">
                        <div>${t.text}</div>
                        <small>${new Date(t.date).toLocaleDateString('vi-VN')}</small>
                    </div>
                    <div class="item-amount ${t.amount > 0 ? 'amount-plus' : 'amount-minus'}">
                        ${t.amount > 0 ? '+' : ''}${t.amount.toLocaleString()} ₫
                        <i class="fas fa-times-circle" style="cursor:pointer; color:var(--text-muted)" onclick="deleteTx(${t.id})"></i>
                    </div>
                `;
                txList.appendChild(item);
            });
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            updateData();
        }

        function calculateStats() {
            const amounts = transactions.map(t => t.amount);
            const total = amounts.reduce((a, b) => a + b, 0);
            const inc = amounts.filter(a => a > 0).reduce((a, b) => a + b, 0);
            const exp = amounts.filter(a => a < 0).reduce((a, b) => a + b, 0) * -1;

            document.getElementById('balance').innerText = `${total.toLocaleString()} ₫`;
            document.getElementById('income').innerText = `${inc.toLocaleString()} ₫`;
            document.getElementById('expense').innerText = `${exp.toLocaleString()} ₫`;
        }

        // --- Daily Notes ---
        function saveNote() {
            const text = document.getElementById('daily-note').value;
            if(!text) return;
            const note = {
                id: Date.now(),
                text: text,
                date: new Date().toLocaleDateString('vi-VN')
            };
            notes.push(note);
            localStorage.setItem('sp_notes', JSON.stringify(notes));
            document.getElementById('daily-note').value = '';
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            container.innerHTML = '';
            notes.slice(-3).reverse().forEach(n => {
                const div = document.createElement('div');
                div.className = 'note-item';
                div.innerHTML = `<small>${n.date}</small><br>${n.text}`;
                container.appendChild(div);
            });
        }

        // --- Weekly Analysis ---
        function analyzeWeekly() {
            const now = new Date();
            const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const twoWeeksAgo = new Date(now.getTime() - 14 * 24 * 60 * 60 * 1000);

            const thisWeekExp = transactions
                .filter(t => t.amount < 0 && new Date(t.date) > oneWeekAgo)
                .reduce((a, b) => a + b, 0) * -1;

            const lastWeekExp = transactions
                .filter(t => t.amount < 0 && new Date(t.date) <= oneWeekAgo && new Date(t.date) > twoWeeksAgo)
                .reduce((a, b) => a + b, 0) * -1;

            const container = document.getElementById('weekly-analysis');
            if(lastWeekExp === 0) {
                container.innerHTML = `<p>Chưa có dữ liệu tuần trước để so sánh.</p>`;
                return;
            }

            const diff = ((thisWeekExp - lastWeekExp) / lastWeekExp * 100).toFixed(1);
            const isUp = diff > 0;

            container.innerHTML = `
                <div class="comparison-box ${isUp ? 'up' : 'down'}">
                    ${isUp ? '↑ Tăng' : '↓ Giảm'} ${Math.abs(diff)}% chi tiêu
                </div>
                <p style="font-size: 0.8rem; margin-top: 10px; color: var(--text-muted);">
                    Tuần này: ${thisWeekExp.toLocaleString()} ₫<br>
                    Tuần trước: ${lastWeekExp.toLocaleString()} ₫
                </p>
            `;
        }

        // --- Chart ---
        function renderChart() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            const inc = transactions.filter(a => a > 0).reduce((a, b) => a + b, 0);
            const exp = transactions.filter(a => a < 0).reduce((a, b) => a + b, 0) * -1;

            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Thu nhập', 'Chi tiêu'],
                    datasets: [{
                        data: [inc, exp],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { labels: { color: 'white' } } } }
            });
        }

        function init() {
            updateData();
            renderNotes();
            const tips = [
                "Quy tắc 50/30/20: 50% thiết yếu, 30% sở thích, 20% tiết kiệm.",
                "Hãy ghi lại mọi khoản chi nhỏ nhất, đó là nơi tiền 'biến mất' nhiều nhất.",
                "Hãy đặt mục tiêu tiết kiệm trước khi bắt đầu chi tiêu.",
                "Xem lại chi tiêu hàng tuần giúp bạn kiểm soát tài chính tốt hơn."
            ];
            document.getElementById('finance-tip').innerText = tips[Math.floor(Math.random()*tips.length)];
        }
    </script>
</body>
</html>
